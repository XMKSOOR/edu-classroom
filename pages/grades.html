<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المدرسة النظامية - الدرجات</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.44.0/tabler-icons.min.css">
<link rel="stylesheet" href="../css/style.css">
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
<script src="../js/firebase-config.js"></script>
</head>
<body>
<div class="app-wrapper">

<header class="topbar">
  <a href="../dashboard.html" class="logo"><i class="ti ti-school" aria-hidden="true"></i><span>المدرسة النظامية</span></a>
  <nav class="topbar-center" aria-label="التنقل الرئيسي">
    <a href="../dashboard.html" class="nav-tab"><i class="ti ti-home" aria-hidden="true"></i><span> الرئيسية</span></a>
    <a href="calendar.html" class="nav-tab"><i class="ti ti-calendar" aria-hidden="true"></i><span> التقويم</span></a>
    <a href="grades.html" class="nav-tab active"><i class="ti ti-chart-bar" aria-hidden="true"></i><span> الدرجات</span></a>
  </nav>
  <div class="topbar-left">
    <button class="btn-icon" onclick="showNotification('لا توجد إشعارات جديدة')" aria-label="الإشعارات"><i class="ti ti-bell" aria-hidden="true"></i></button>
    <a href="profile.html" class="user-btn"><div class="avatar" id="userAvatar" aria-hidden="true">...</div><span id="userName">جاري التحميل...</span></a>
    <button class="btn-icon" onclick="logout()" title="تسجيل الخروج" aria-label="تسجيل الخروج"><i class="ti ti-logout" aria-hidden="true"></i></button>
  </div>
</header>

<main class="main-content">
  <section aria-label="سجل الدرجات">
    <div class="section-header"><span>سجل الدرجات</span></div>
    <div id="gradesContent"><div class="loading-spinner"><i class="ti ti-loader" aria-hidden="true"></i></div></div>
  </section>
</main>

</div>

<div id="notification" class="notification hidden" role="alert" aria-live="polite"></div>

<script>try { var u = JSON.parse(localStorage.getItem('edu_user')); if (u && u.uid) currentUser = u; } catch (e) {}</script>
<script src="../js/app.js"></script>
<script>
function init() {
  if (!currentUser) { window.location.href = '../index.html'; return; }
  document.getElementById('userName').textContent = currentUser.name;
  document.getElementById('userAvatar').textContent = currentUser.name.substring(0, 2);
  getClassRef().onSnapshot(function(snap) {
    _cloudClasses = snap.docs.map(function(d) { return {id: d.id, ...d.data()}; });
    renderGrades();
  });
}

function renderGrades() {
  var g = document.getElementById('gradesContent');
  if (!_cloudClasses.length) { g.innerHTML = '<div class="empty-state"><i class="ti ti-chart-bar" aria-hidden="true"></i><h3>لا توجد درجات بعد</h3></div>'; return; }
  var isTeacher = currentUser && currentUser.role === 'teacher';
  g.innerHTML = _cloudClasses.map(function(c) {
    var col = COLORS[c.color] || COLORS[0];
    return '<article class="card" style="margin-bottom:16px"><header class="card-header">' +
      '<div style="width:10px;height:10px;border-radius:50%;background:' + col.bg + '" aria-hidden="true"></div>' +
      '<h3>' + c.name + '</h3></header><div style="display:flex;flex-direction:column;gap:8px">' +
      ((c.assignments_data || []).map(function(a) {
        var userSub = (a.submissions || []).find(function(s) { return s.uid === currentUser.uid; });
        var status, label, color;
        if (isTeacher) {
          var subCount = (a.submissions || []).length;
          var memberCount = (c.members || []).filter(function(m) { return m !== c.teacherId; }).length || 1;
          status = subCount > 0 ? 'done' : 'pending';
          label = subCount + '/' + memberCount + ' سلَّم';
          color = subCount > 0 ? 'var(--green)' : 'var(--text3)';
        } else {
          status = userSub ? 'done' : (a.dueISO && new Date(a.dueISO) < new Date() ? 'late' : 'pending');
          var gradeMap = {done: 'مُسلَّم', pending: '—', late: 'متأخر'};
          var colorMap = {done: 'var(--green)', pending: 'var(--text3)', late: 'var(--red)'};
          label = gradeMap[status] || '—';
          color = colorMap[status] || 'var(--text3)';
        }
        return '<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--surface2);border-radius:8px">' +
          '<span style="font-size:14px">' + a.title + '</span>' +
          '<div style="display:flex;align-items:center;gap:16px">' +
          '<span style="font-size:12px;color:var(--text3)">' + (a.points || 0) + ' درجة</span>' +
          '<span style="font-size:13px;font-weight:600;color:' + color + '">' + label + '</span>' +
          '</div></div>';
      }).join('') || '<div style="text-align:center;padding:20px;color:var(--text3)">لا توجد مهام</div>') +
      '</div></article>';
  }).join('');
}
init();
</script>
</body>
</html>

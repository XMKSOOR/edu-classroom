<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المدرسة النظامية - الدرجات</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.44.0/tabler-icons.min.css">
<link rel="stylesheet" href="../css/style.css">
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-analytics-compat.js"></script>
<script src="../js/firebase-config.js"></script>
</head>
<body>
<div class="app-wrapper">
<div class="topbar">
  <a href="../dashboard.html" class="logo"><i class="ti ti-school"></i><span>المدرسة النظامية</span></a>
  <div class="topbar-center">
    <a href="../dashboard.html" class="nav-tab"><i class="ti ti-home"></i><span> الرئيسية</span></a>
    <a href="calendar.html" class="nav-tab"><i class="ti ti-calendar"></i><span> التقويم</span></a>
    <a href="grades.html" class="nav-tab active"><i class="ti ti-chart-bar"></i><span> الدرجات</span></a>
  </div>
  <div class="topbar-left">
    <button class="btn-icon" onclick="showNotification('لا توجد إشعارات جديدة')"><i class="ti ti-bell"></i></button>
    <a href="profile.html" class="user-btn"><div class="avatar" id="userAvatar">...</div><span id="userName">جاري التحميل...</span></a>
    <button class="btn-icon" onclick="logout()"><i class="ti ti-logout"></i></button>
  </div>
</div>
<div class="main-content">
  <div class="section-header"><span>سجل الدرجات</span></div>
  <div id="gradesContent">
    <div class="loading-spinner"><i class="ti ti-loader"></i></div>
  </div>
</div>
</div>
<div id="notification" class="notification hidden"></div>
<script>try{const u=JSON.parse(localStorage.getItem('edu_user'));if(u)currentUser=u}catch(e){}</script>
<script src="../js/app.js"></script>
<script>
function init(){
  if(!currentUser){window.location.href='../index.html';return}
  document.getElementById('userName').textContent=currentUser.name;
  document.getElementById('userAvatar').textContent=currentUser.name.substring(0,2);
  getClassRef().onSnapshot(snap=>{
    _cloudClasses=snap.docs.map(d=>({id:d.id,...d.data()}));
    renderGrades();
  });
}
function renderGrades(){
  const g=document.getElementById('gradesContent');
  if(!_cloudClasses.length){
    g.innerHTML=`<div class="empty-state"><i class="ti ti-chart-bar"></i><h3>لا توجد درجات بعد</h3></div>`;
    return;
  }
  g.innerHTML=_cloudClasses.map(c=>{
    const col=COLORS[c.color]||COLORS[0];
    return `<div class="card" style="margin-bottom:16px">
      <div class="card-header">
        <div style="width:10px;height:10px;border-radius:50%;background:${col.bg}"></div>
        <h3>${c.name}</h3>
      </div>
      <div style="display:flex;flex-direction:column;gap:8px">${
        (c.assignments_data||[]).map(a=>{
          const gradeMap={done:'مُسلَّم',pending:'—',late:'متأخر'};
          const colorMap={done:'var(--green)',pending:'var(--text3)',late:'var(--red)'};
          return `<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--surface2);border-radius:8px">
            <span style="font-size:14px">${a.title}</span>
            <div style="display:flex;align-items:center;gap:16px">
              <span style="font-size:12px;color:var(--text3)">${a.points||0} درجة</span>
              <span style="font-size:13px;font-weight:600;color:${colorMap[a.status]}">${gradeMap[a.status]}</span>
            </div>
          </div>`;
        }).join('')||'<div style="text-align:center;padding:20px;color:var(--text3)">لا توجد مهام</div>'
      }</div>
    </div>`;
  }).join('');
}
init();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المدرسة النظامية - عرض الصف</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.44.0/tabler-icons.min.css">
<link rel="stylesheet" href="../css/style.css">
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
<script src="../js/firebase-config.js"></script>
</head>
<body>
<div class="app-wrapper">

<header class="topbar" style="display:none" id="topbar">
  <a href="../dashboard.html" class="logo"><i class="ti ti-school" aria-hidden="true"></i><span>المدرسة النظامية</span></a>
  <nav class="topbar-center" aria-label="التنقل الرئيسي">
    <a href="../dashboard.html" class="nav-tab"><i class="ti ti-home" aria-hidden="true"></i><span> الرئيسية</span></a>
    <a href="calendar.html" class="nav-tab"><i class="ti ti-calendar" aria-hidden="true"></i><span> التقويم</span></a>
    <a href="grades.html" class="nav-tab"><i class="ti ti-chart-bar" aria-hidden="true"></i><span> الدرجات</span></a>
  </nav>
  <div class="topbar-left">
    <button class="btn-icon" onclick="showNotification('لا توجد إشعارات جديدة')" aria-label="الإشعارات"><i class="ti ti-bell" aria-hidden="true"></i></button>
    <a href="profile.html" class="user-btn"><div class="avatar" id="userAvatar" aria-hidden="true">...</div><span id="userName">جاري التحميل...</span></a>
    <button class="btn-icon" onclick="logout()" title="تسجيل الخروج" aria-label="تسجيل الخروج"><i class="ti ti-logout" aria-hidden="true"></i></button>
  </div>
</header>

<main class="main-content">
  <div id="loadingView" class="loading-spinner"><i class="ti ti-loader" aria-hidden="true"></i></div>
  <div id="classContent" hidden>
    <button class="back-btn" onclick="window.location.href='../dashboard.html'" aria-label="العودة للصفوف"><i class="ti ti-arrow-right" aria-hidden="true"></i> العودة للصفوف</button>
    <section id="classHero" class="class-hero" aria-label="معلومات الصف"></section>
    <div class="tabs-bar" role="tablist" aria-label="أقسام الصف">
      <button class="tab active" role="tab" aria-selected="true" aria-controls="tab-stream" id="tab-btn-stream" onclick="switchTab('stream')">الإعلانات</button>
      <button class="tab" role="tab" aria-selected="false" aria-controls="tab-assignments" id="tab-btn-assignments" onclick="switchTab('assignments')">المهام</button>
      <button class="tab" role="tab" aria-selected="false" aria-controls="tab-lessons" id="tab-btn-lessons" onclick="switchTab('lessons')">الدروس</button>
      <button class="tab" role="tab" aria-selected="false" aria-controls="tab-people" id="tab-btn-people" onclick="switchTab('people')">الأعضاء</button>
    </div>
    <div id="tab-stream" class="tab-content" role="tabpanel" aria-labelledby="tab-btn-stream"></div>
    <div id="tab-assignments" class="tab-content" role="tabpanel" aria-labelledby="tab-btn-assignments" hidden></div>
    <div id="tab-lessons" class="tab-content" role="tabpanel" aria-labelledby="tab-btn-lessons" hidden></div>
    <div id="tab-people" class="tab-content" role="tabpanel" aria-labelledby="tab-btn-people" hidden></div>
  </div>
</main>

</div>

<div id="notification" class="notification hidden" role="alert" aria-live="polite"></div>

<dialog id="modal-submitAssign">
  <div class="modal">
    <h2>تسليم المهمة</h2>
    <p id="submitAssignTitle" style="font-weight:600;font-size:14px;color:var(--text1);margin-bottom:16px"></p>
    <div class="upload-area" onclick="document.getElementById('fileInput').click()">
      <i class="ti ti-upload" id="uploadIcon" aria-hidden="true"></i>
      <p id="uploadText">انقر لرفع ملف المهمة</p>
      <p style="font-size:11px;color:var(--text3);margin-top:4px">PDF, Word, أو صور</p>
    </div>
    <input type="file" id="fileInput" accept=".pdf,.doc,.docx,.png,.jpg,.jpeg,.zip" style="display:none" onchange="handleFileSelect(this)">
    <div class="form-group" style="margin-top:16px"><label for="submitNote">ملاحظة للمعلم (اختياري)</label><textarea id="submitNote" placeholder="اكتب ملاحظتك هنا..."></textarea></div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="document.getElementById('modal-submitAssign').close()">إلغاء</button>
      <button class="btn btn-success" id="submitBtn" onclick="submitAssignment()"><i class="ti ti-send"></i> تسليم</button>
    </div>
  </div>
</dialog>

<dialog id="modal-addLesson">
  <div class="modal">
    <h2>ربط درس جديد</h2>
    <p>أضف رابط درس أو مادة تعليمية لهذا الصف</p>
    <div class="form-group"><label for="ls-title">عنوان الدرس</label><input id="ls-title" placeholder="مثال: درس المعادلات التربيعية" required></div>
    <div class="form-group"><label for="ls-type">نوع المحتوى</label>
      <select id="ls-type">
        <option value="video">فيديو يوتيوب</option>
        <option value="doc">مستند / PDF</option>
        <option value="quiz">اختبار قصير</option>
        <option value="link">رابط خارجي</option>
      </select>
    </div>
    <div class="form-group"><label for="ls-url">الرابط</label><input id="ls-url" placeholder="https://..."></div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="document.getElementById('modal-addLesson').close()">إلغاء</button>
      <button class="btn btn-primary" id="addLessonBtn" onclick="addLesson()"><i class="ti ti-link"></i> إضافة الدرس</button>
    </div>
  </div>
</dialog>

<dialog id="modal-addPost">
  <div class="modal">
    <h2>إضافة إعلان</h2>
    <p>شارك إعلاناً مع طلاب الصف</p>
    <div class="form-group"><label for="postText">نص الإعلان</label><textarea id="postText" placeholder="اكتب إعلانك هنا..." style="min-height:100px" required></textarea></div>
    <div class="form-group"><label>مرفق (اختياري)</label>
      <div class="upload-area" onclick="document.getElementById('postFile').click()" style="padding:14px">
        <i class="ti ti-paperclip" id="postIcon" style="font-size:20px" aria-hidden="true"></i>
        <p id="postFileName" style="font-size:12px">إرفاق ملف</p>
      </div>
      <input type="file" id="postFile" style="display:none" onchange="handlePostFile(this)">
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="document.getElementById('modal-addPost').close()">إلغاء</button>
      <button class="btn btn-primary" id="publishBtn" onclick="addPost()"><i class="ti ti-send"></i> نشر</button>
    </div>
  </div>
</dialog>

<dialog id="modal-createAssign">
  <div class="modal">
    <h2>إضافة مهمة جديدة</h2>
    <p>أنشئ واجباً لطلاب هذا الصف</p>
    <div class="form-group"><label for="ca-title">عنوان المهمة</label><input id="ca-title" placeholder="مثال: واجب المعادلات التربيعية" required></div>
    <div class="form-group"><label for="ca-desc">الوصف</label><textarea id="ca-desc" placeholder="وصف المهمة والتعليمات..."></textarea></div>
    <div class="form-row">
      <div class="form-group"><label for="ca-due">تاريخ التسليم</label><input id="ca-due" type="date" style="font-family:'Cairo',sans-serif" required></div>
      <div class="form-group"><label for="ca-points">الدرجة</label><input id="ca-points" type="number" value="20" min="1" max="100"></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="document.getElementById('modal-createAssign').close()">إلغاء</button>
      <button class="btn btn-primary" onclick="createAssignment()"><i class="ti ti-plus"></i> إنشاء</button>
    </div>
  </div>
</dialog>

<dialog id="modal-viewSubs">
  <div class="modal" style="max-width:600px">
    <h2>تسليمات المهمة</h2>
    <p id="viewSubTitle" style="font-weight:600;font-size:14px;color:var(--text1);margin-bottom:16px"></p>
    <div id="submissionsList" style="display:flex;flex-direction:column;gap:8px;max-height:400px;overflow-y:auto"></div>
    <div class="modal-actions"><button class="btn btn-secondary" onclick="document.getElementById('modal-viewSubs').close()">إغلاق</button></div>
  </div>
</dialog>

<script>try { var u = JSON.parse(localStorage.getItem('edu_user')); if (u && u.uid) currentUser = u; } catch (e) {}</script>
<script src="../js/app.js"></script>
<script>
var _currentClass = null;
var _uploadedFile = null;
var _postFile = null;
var _currentAssignId = null;

function init() {
  if (!currentUser) { window.location.href = '../index.html'; return; }
  document.getElementById('topbar').style.display = 'flex';
  document.getElementById('userName').textContent = currentUser.name;
  document.getElementById('userAvatar').textContent = currentUser.name.substring(0, 2);
  var classId = getClassIdFromUrl();
  if (!classId) { showNotification('معرّف الصف غير موجود'); window.location.href = '../dashboard.html'; return; }
  getAllClassesRef().doc(classId).onSnapshot(function(doc) {
    if (!doc.exists) { showNotification('الصف غير موجود'); window.location.href = '../dashboard.html'; return; }
    _currentClass = {id: doc.id, ...doc.data()};
    document.getElementById('loadingView').hidden = true;
    document.getElementById('classContent').hidden = false;
    renderHero();
    renderActiveTab();
  }, function(err) { Logger.error('class listener: ' + err.message); });
}

function renderHero() {
  var c = _currentClass;
  var col = COLORS[c.color] || COLORS[0];
  document.getElementById('classHero').style.background = col.grad;
  document.getElementById('classHero').innerHTML = '<h1>' + c.name + '</h1><p>' + (c.teacher || '') + ' &nbsp;·&nbsp; رمز الصف: <strong>' + (c.code || '') + '</strong></p><div class="hero-stats">' +
    '<div class="hero-stat"><div class="num">' + (c.students || 0) + '</div><div class="lbl">طالب</div></div>' +
    '<div class="hero-stat"><div class="num">' + (c.assignments_data || []).length + '</div><div class="lbl">مهمة</div></div>' +
    '<div class="hero-stat"><div class="num">' + (c.lessons_data || []).length + '</div><div class="lbl">درس</div></div>' +
    '<div class="hero-stat"><div class="num">' + (c.progress || 0) + '%</div><div class="lbl">إنجاز</div></div></div>';
}

function switchTab(name) {
  document.querySelectorAll('.tab-content').forEach(function(t) { t.style.display = 'none'; t.setAttribute('hidden', ''); });
  document.querySelectorAll('[role=tab]').forEach(function(t) { t.classList.remove('active'); t.setAttribute('aria-selected', 'false'); });
  var tab = document.getElementById('tab-btn-' + name);
  if (tab) { tab.classList.add('active'); tab.setAttribute('aria-selected', 'true'); }
  var panel = document.getElementById('tab-' + name);
  if (panel) { panel.style.display = 'block'; panel.removeAttribute('hidden'); }
  var c = _currentClass;
  if (name === 'stream') renderStream(c);
  if (name === 'assignments') renderAssignments(c);
  if (name === 'lessons') renderLessons(c);
  if (name === 'people') renderPeople(c);
}

function renderActiveTab() {
  var active = document.querySelector('[role=tab].active');
  var onclick = active ? active.getAttribute('onclick') : '';
  var m = onclick.match(/'(\w+)'/);
  switchTab(m ? m[1] : 'stream');
}

function renderStream(c) {
  var t = document.getElementById('tab-stream');
  var isTeacher = currentUser && currentUser.role === 'teacher';
  t.innerHTML = (isTeacher ? '<div class="stream-post" style="border:2px dashed var(--border);background:var(--surface2);cursor:pointer" onclick="document.getElementById(\'modal-addPost\').showModal()">' +
    '<div style="display:flex;align-items:center;gap:10px;color:var(--text3)">' +
    '<div class="avatar" style="background:var(--primary);color:#fff">' + currentUser.name.substring(0, 2) + '</div>' +
    '<span style="font-size:14px">شارك إعلاناً مع الصف...</span></div></div>' : '') +
    (c.stream || []).map(function(p) {
      return '<article class="stream-post"><header class="post-header">' +
        '<div class="avatar" style="background:' + (p.avatarColor || 'var(--primary)') + '">' + (p.avatar || (p.author ? p.author.substring(0, 2) : '?')) + '</div>' +
        '<div><div style="font-size:14px;font-weight:600">' + (p.author || '') + '</div></div>' +
        '<time class="post-time" datetime="' + (p.iso || '') + '">' + (p.time || '') + '</time></header>' +
        '<p class="post-text">' + (p.text || '') + '</p>' +
        (p.attachment ? '<div class="post-attachment" onclick="window.open(\'' + p.attachment.url + '\',\'_blank\')"><i class="ti ' + (p.attachment.icon || 'ti-file') + '" style="font-size:20px;color:var(--primary)"></i><span>' + p.attachment.name + '</span><i class="ti ti-download" style="margin-right:auto;color:var(--text3)"></i></div>' : '') +
        '</article>';
    }).join('');
  if (!c.stream || (!c.stream.length && !isTeacher)) t.innerHTML = '<div class="empty-state"><i class="ti ti-message"></i><h3>لا توجد إعلانات بعد</h3><p>سيتم عرض إعلانات المعلم هنا</p></div>';
}

function renderAssignments(c) {
  var t = document.getElementById('tab-assignments');
  var isTeacher = currentUser && currentUser.role === 'teacher';
  var icons = {pending: 'ti-clock', done: 'ti-check', late: 'ti-alert-triangle'};
  var labels = {pending: 'قيد التسليم', done: 'مُسلَّم', late: 'متأخر'};
  t.innerHTML = '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">' +
    '<span style="font-size:15px;font-weight:600">المهام والواجبات</span>' +
    (isTeacher ? '<button class="btn btn-primary btn-sm" onclick="document.getElementById(\'modal-createAssign\').showModal()"><i class="ti ti-plus"></i> إضافة مهمة</button>' : '') +
    '</div><div class="assignments-list">' +
    ((c.assignments_data || []).map(function(a) {
      var colors = {pending: ['#fff9e6', '#fa7b17'], done: ['#e6f4ea', '#1e8e3e'], late: ['#fce8e6', '#d93025']};
      var sl = colors[a.status] || colors.pending;
      var click = isTeacher ? "document.getElementById('modal-viewSubs').showModal();viewSubmissions(" + a.id + ",'" + a.title.replace(/'/g, "\\'") + "')" : "document.getElementById('modal-submitAssign').showModal();openSubmit(" + a.id + ",'" + a.title.replace(/'/g, "\\'") + "')";
      return '<article class="assignment-card" onclick="' + click + '">' +
        '<div class="assign-icon" style="background:' + sl[0] + ';color:' + sl[1] + '"><i class="ti ' + (icons[a.status] || 'ti-clock') + '"></i></div>' +
        '<div class="assign-info"><h4>' + a.title + '</h4><p>' + (a.desc || '') + '</p></div>' +
        '<div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px">' +
        '<span class="assign-badge" style="background:' + sl[0] + ';color:' + sl[1] + '">' + (labels[a.status] || '') + '</span>' +
        '<time class="assign-date" datetime="' + (a.dueISO || '') + '"><i class="ti ti-calendar" style="font-size:12px"></i> ' + (a.due || '') + '</time>' +
        '<span style="font-size:12px;color:var(--text3)">' + (a.points || 0) + ' درجة</span></div></article>';
    }).join('') || '<div class="empty-state"><i class="ti ti-clipboard"></i><h3>لا توجد مهام بعد</h3></div>') +
    '</div>';
}

function renderLessons(c) {
  var t = document.getElementById('tab-lessons');
  var typeLabel = {video: 'فيديو', doc: 'مستند', quiz: 'اختبار', link: 'رابط'};
  var typeIcon = {video: 'ti-player-play', doc: 'ti-file-description', quiz: 'ti-clipboard-check', link: 'ti-external-link'};
  var isTeacher = currentUser && currentUser.role === 'teacher';
  t.innerHTML = '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">' +
    '<span style="font-size:15px;font-weight:600">الدروس والمواد</span>' +
    (isTeacher ? '<button class="btn btn-primary btn-sm" onclick="document.getElementById(\'modal-addLesson\').showModal()"><i class="ti ti-link"></i> ربط درس</button>' : '') +
    '</div><div class="lessons-grid">' +
    ((c.lessons_data || []).map(function(l) {
      return '<article class="lesson-card" onclick="openLesson(\'' + (l.url || '').replace(/'/g, "\\'") + '\',\'' + l.title.replace(/'/g, "\\'") + '\')">' +
        '<div class="lesson-thumb" style="background:' + (l.color || 'var(--surface3)') + '"><span style="font-size:42px">' + (l.emoji || '📄') + '</span><span class="lesson-tag">' + (typeLabel[l.type] || 'رابط') + '</span></div>' +
        '<div class="lesson-body"><h4>' + l.title + '</h4><p>' + (l.desc || '') + '</p>' +
        '<footer class="lesson-footer"><span class="lesson-type"><i class="ti ' + (typeIcon[l.type] || 'ti-link') + '" style="font-size:13px"></i> ' + (typeLabel[l.type] || 'رابط') + '</span>' +
        '<button class="btn btn-primary btn-sm" onclick="event.stopPropagation();openLesson(\'' + (l.url || '').replace(/'/g, "\\'") + '\',\'' + l.title.replace(/'/g, "\\'") + '\')">فتح</button></footer></div></article>';
    }).join('') || '<div class="empty-state"><i class="ti ti-book"></i><h3>لا توجد دروس بعد</h3></div>') +
    '</div>';
}

function renderPeople(c) {
  var t = document.getElementById('tab-people');
  var memberIds = c.members || [];
  if (!memberIds.length) { t.innerHTML = '<div class="empty-state"><i class="ti ti-users"></i><h3>لا يوجد أعضاء بعد</h3></div>'; return; }
  var promises = memberIds.map(function(uid) {
    return db.collection('users').doc(uid).get().then(function(d) {
      if (!d.exists) return null;
      var d2 = d.data();
      return {uid: d.id, name: d2.name, role: d2.role};
    });
  });
  Promise.all(promises).then(function(members) {
    var valid = members.filter(function(m) { return m; });
    var teachers = valid.filter(function(p) { return p.role === 'teacher'; });
    var students = valid.filter(function(p) { return p.role !== 'teacher'; });
    t.innerHTML = '<section style="margin-bottom:16px">' +
      '<div style="font-size:13px;font-weight:600;color:var(--text2);margin-bottom:12px;display:flex;align-items:center;gap:6px"><i class="ti ti-shield-check" style="color:var(--primary)"></i> المعلمون</div>' +
      teachers.map(function(p) { return '<article class="person-card" style="margin-bottom:12px"><div class="person-avatar" style="background:var(--primary);color:#fff">' + p.name.substring(0, 2) + '</div><div class="person-info"><h4>' + p.name + '</h4><p>معلم الصف</p></div><span class="person-role-badge" style="background:var(--primary-light);color:var(--primary)">معلم</span></article>'; }).join('') +
      '</section><section>' +
      '<div style="font-size:13px;font-weight:600;color:var(--text2);margin-bottom:12px;display:flex;align-items:center;gap:6px"><i class="ti ti-users" style="color:var(--green)"></i> الطلاب (' + students.length + ')</div>' +
      '<div class="people-list">' +
      (students.length ? students.map(function(p) { return '<article class="person-card"><div class="person-avatar" style="background:var(--surface3);color:var(--text1)">' + p.name.substring(0, 2) + '</div><div class="person-info"><h4>' + p.name + '</h4><p>طالب</p></div><span class="person-role-badge" style="background:var(--green-light);color:var(--green)">طالب</span></article>'; }).join('') : '<div class="empty-state"><i class="ti ti-users"></i><h3>لا يوجد أعضاء بعد</h3></div>') +
      '</div></section>';
  }).catch(function(e) { Logger.error('renderPeople: ' + e.message); });
}

/* ========== POST ========== */
function handlePostFile(input) {
  var f = input.files[0];
  if (!f) return;
  _postFile = f;
  document.getElementById('postIcon').className = 'ti ti-file';
  document.getElementById('postFileName').textContent = f.name;
}

function addPost() {
  var text = document.getElementById('postText').value.trim();
  if (!text) { showNotification('اكتب نص الإعلان أولاً'); return; }
  var post = {id: Date.now(), author: currentUser.name, avatar: currentUser.name.substring(0, 2), avatarColor: '#1a73e8', time: new Date().toLocaleString('ar-SA'), iso: new Date().toISOString(), text: text, attachment: null};
  var doUpdate = function(p) { return getAllClassesRef().doc(_currentClass.id).update({stream: firebase.firestore.FieldValue.arrayUnion(p)}); };
  if (_postFile) {
    document.getElementById('publishBtn').disabled = true;
    var ref = storage.ref('stream/' + _currentClass.id + '/' + Date.now() + '_' + _postFile.name);
    ref.put(_postFile).then(function(s) { return s.ref.getDownloadURL(); }).then(function(url) {
      post.attachment = {name: _postFile.name, icon: 'ti-file', url: url};
      return doUpdate(post);
    }).then(function() { document.getElementById('modal-addPost').close(); resetPostForm(); showNotification('تم النشر 🎉'); }).catch(function(e) { showNotification(e.message); });
  } else {
    doUpdate(post).then(function() { document.getElementById('modal-addPost').close(); resetPostForm(); showNotification('تم النشر 🎉'); }).catch(function(e) { showNotification(e.message); });
  }
}

function resetPostForm() {
  document.getElementById('postText').value = '';
  _postFile = null;
  document.getElementById('postIcon').className = 'ti ti-paperclip';
  document.getElementById('postFileName').textContent = 'إرفاق ملف';
  document.getElementById('publishBtn').disabled = false;
}

/* ========== ASSIGNMENTS ========== */
function openSubmit(id, title) {
  _currentAssignId = id;
  _uploadedFile = null;
  document.getElementById('fileInput').value = '';
  document.getElementById('uploadIcon').className = 'ti ti-upload';
  document.getElementById('uploadIcon').style.color = '';
  document.getElementById('uploadText').textContent = 'انقر لرفع ملف المهمة';
  document.getElementById('submitAssignTitle').textContent = title;
}

function handleFileSelect(input) {
  var f = input.files[0];
  if (!f) return;
  if (f.size > 20 * 1024 * 1024) { showNotification('الملف كبير جداً (20MB حد أقصى) ⚠️'); return; }
  _uploadedFile = f;
  document.getElementById('uploadIcon').className = 'ti ti-file';
  document.getElementById('uploadIcon').style.color = 'var(--primary)';
  document.getElementById('uploadText').textContent = f.name + ' (' + (f.size / 1024).toFixed(1) + 'KB)';
}

function submitAssignment() {
  if (!_uploadedFile) { showNotification('يرجى اختيار ملف أولاً ⚠️'); return; }
  var a = (_currentClass.assignments_data || []).find(function(x) { return x.id === _currentAssignId; });
  if (a && (a.submissions || []).some(function(s) { return s.uid === currentUser.uid; })) {
    showNotification('لقد سلَّمت هذه المهمة مسبقاً ⚠️');
    document.getElementById('submitBtn').disabled = false;
    return;
  }
  document.getElementById('submitBtn').disabled = true;
  document.getElementById('submitBtn').innerHTML = '<i class="ti ti-loader"></i> جاري الرفع...';
  var ref = storage.ref('assignments/' + _currentClass.id + '/' + _currentAssignId + '/' + currentUser.uid + '_' + _uploadedFile.name);
  ref.put(_uploadedFile).then(function(s) { return s.ref.getDownloadURL(); }).then(function(url) {
    var note = document.getElementById('submitNote').value.trim();
    var sub = {uid: currentUser.uid, name: currentUser.name, file: url, fileName: _uploadedFile.name, submittedAt: Date.now(), note: note || ''};
    var existing = _currentClass.assignments_data || [];
    var updated = existing.map(function(ax) {
      if (ax.id !== _currentAssignId) return ax;
      var subs = ax.submissions || [];
      return {id: ax.id, title: ax.title, desc: ax.desc, due: ax.due, dueISO: ax.dueISO, status: 'done', points: ax.points, submissions: subs.concat([sub])};
    });
    return getAllClassesRef().doc(_currentClass.id).update({assignments_data: updated});
  }).then(function() {
    document.getElementById('modal-submitAssign').close();
    document.getElementById('submitNote').value = '';
    showNotification('تم تسليم المهمة بنجاح! 🎉');
  }).catch(function(e) { showNotification(e.message); }).finally(function() {
    document.getElementById('submitBtn').disabled = false;
    document.getElementById('submitBtn').innerHTML = '<i class="ti ti-send"></i> تسليم';
    _uploadedFile = null;
  });
}

function createAssignment() {
  var title = document.getElementById('ca-title').value.trim();
  var desc = document.getElementById('ca-desc').value.trim();
  var due = document.getElementById('ca-due').value;
  var pts = parseInt(document.getElementById('ca-points').value) || 20;
  if (!title || !due) { showNotification('أدخل عنوان المهمة وتاريخ التسليم'); return; }
  var dueStr = new Date(due).toLocaleDateString('ar-SA', {day: 'numeric', month: 'long', year: 'numeric'});
  var assign = {id: Date.now(), title: title, desc: desc || 'لا يوجد وصف', due: dueStr, dueISO: due, status: 'pending', points: pts, submissions: []};
  getAllClassesRef().doc(_currentClass.id).update({
    assignments_data: firebase.firestore.FieldValue.arrayUnion(assign),
    assignments: firebase.firestore.FieldValue.increment(1)
  }).then(function() {
    document.getElementById('modal-createAssign').close();
    document.getElementById('ca-title').value = '';
    document.getElementById('ca-desc').value = '';
    document.getElementById('ca-due').value = '';
    document.getElementById('ca-points').value = '20';
    showNotification('تم إنشاء المهمة 📝');
  }).catch(function(e) { showNotification(e.message); });
}

function viewSubmissions(id, title) {
  var a = (_currentClass.assignments_data || []).find(function(x) { return x.id === id; });
  var subs = (a && a.submissions) || [];
  document.getElementById('viewSubTitle').textContent = title + ' (' + subs.length + ' تسليم)';
  document.getElementById('submissionsList').innerHTML = subs.length
    ? subs.map(function(s) {
        return '<div style="display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--surface2);border-radius:8px">' +
          '<div class="avatar" style="background:var(--primary);color:#fff;width:36px;height:36px;font-size:13px">' + (s.name ? s.name.substring(0, 2) : '?') + '</div>' +
          '<div style="flex:1"><div style="font-size:14px;font-weight:600">' + (s.name || '') + '</div><time style="font-size:11px;color:var(--text3)" datetime="' + (s.submittedAt ? new Date(s.submittedAt).toISOString() : '') + '">' + (s.submittedAt ? new Date(s.submittedAt).toLocaleDateString('ar-SA') : '') + '</time></div>' +
          (s.file ? '<a href="' + s.file + '" target="_blank" class="btn btn-sm btn-primary"><i class="ti ti-download"></i></a>' : '') +
          (s.note ? '<span style="font-size:11px;color:var(--text2);max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + s.note + '</span>' : '') +
          '</div>';
      }).join('')
    : '<div class="empty-state"><i class="ti ti-inbox"></i><h3>لا توجد تسليمات بعد</h3></div>';
}

/* ========== LESSONS ========== */
function openLesson(url, title) {
  if (url && url.indexOf('http') === 0) { window.open(url, '_blank'); Logger.info('openLesson: ' + title); }
  else showNotification('هذا الدرس لا يحتوي على رابط بعد');
}

function addLesson() {
  var title = document.getElementById('ls-title').value.trim();
  var type = document.getElementById('ls-type').value;
  var url = document.getElementById('ls-url').value.trim();
  if (!title) { showNotification('أدخل عنوان الدرس'); return; }
  document.getElementById('addLessonBtn').disabled = true;
  document.getElementById('addLessonBtn').innerHTML = '<i class="ti ti-loader"></i>';
  var emojiMap = {video: '📹', doc: '📄', quiz: '📝', link: '🔗'};
  var colorMap = {video: '#e8f0fe', doc: '#e6f4ea', quiz: '#fef3e2', link: '#f3e8fd'};
  var newLesson = {id: Date.now(), title: title, desc: 'درس مُضاف حديثاً', type: type, url: url, emoji: emojiMap[type], color: colorMap[type]};
  getAllClassesRef().doc(_currentClass.id).update({
    lessons_data: firebase.firestore.FieldValue.arrayUnion(newLesson)
  }).then(function() {
    document.getElementById('ls-title').value = '';
    document.getElementById('ls-url').value = '';
    document.getElementById('modal-addLesson').close();
    showNotification('تم ربط الدرس بنجاح! ✅');
  }).catch(function(e) { showNotification(e.message); }).finally(function() {
    document.getElementById('addLessonBtn').disabled = false;
    document.getElementById('addLessonBtn').innerHTML = '<i class="ti ti-link"></i> إضافة الدرس';
  });
}

// ---- Dialog backdrop close ----
document.querySelectorAll('dialog').forEach(function(d) {
  d.addEventListener('click', function(e) { if (e.target === this) this.close(); });
});

init();
</script>

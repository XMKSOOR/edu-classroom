<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المدرسة النظامية - التقويم</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.44.0/tabler-icons.min.css">
<link rel="stylesheet" href="../css/style.css">
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
<script src="../js/firebase-config.js"></script>
</head>
<body>
<div class="app-wrapper">

<header class="topbar">
  <a href="../dashboard.html" class="logo"><i class="ti ti-school" aria-hidden="true"></i><span>المدرسة النظامية</span></a>
  <nav class="topbar-center" aria-label="التنقل الرئيسي">
    <a href="../dashboard.html" class="nav-tab"><i class="ti ti-home" aria-hidden="true"></i><span> الرئيسية</span></a>
    <a href="calendar.html" class="nav-tab active"><i class="ti ti-calendar" aria-hidden="true"></i><span> التقويم</span></a>
    <a href="grades.html" class="nav-tab"><i class="ti ti-chart-bar" aria-hidden="true"></i><span> الدرجات</span></a>
  </nav>
  <div class="topbar-left">
    <button class="btn-icon" onclick="showNotification('لا توجد إشعارات جديدة')" aria-label="الإشعارات"><i class="ti ti-bell" aria-hidden="true"></i></button>
    <a href="profile.html" class="user-btn"><div class="avatar" id="userAvatar" aria-hidden="true">...</div><span id="userName">جاري التحميل...</span></a>
    <button class="btn-icon" onclick="logout()" title="تسجيل الخروج" aria-label="تسجيل الخروج"><i class="ti ti-logout" aria-hidden="true"></i></button>
  </div>
</header>

<main class="main-content">
  <section aria-label="التقويم الأكاديمي">
    <div class="section-header"><span>التقويم الأكاديمي</span></div>
    <article class="card">
      <header style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
        <button class="btn btn-secondary btn-sm" onclick="prevMonth()" aria-label="الشهر السابق"><i class="ti ti-chevron-right" aria-hidden="true"></i></button>
        <h3 id="calTitle" style="font-size:18px;font-weight:700"></h3>
        <button class="btn btn-secondary btn-sm" onclick="nextMonth()" aria-label="الشهر التالي"><i class="ti ti-chevron-left" aria-hidden="true"></i></button>
      </header>
      <div class="cal-grid" id="calGrid" role="grid" aria-label="شبكة التقويم"></div>
    </article>
  </section>
  <section aria-label="المواعيد القادمة" style="margin-top:24px">
    <div class="section-header"><span>المواعيد القادمة</span></div>
    <div id="upcomingList"></div>
  </section>
</main>

</div>

<div id="notification" class="notification hidden" role="alert" aria-live="polite"></div>

<script>try { var u = JSON.parse(localStorage.getItem('edu_user')); if (u && u.uid) currentUser = u; } catch (e) {}</script>
<script src="../js/app.js"></script>
<script>
var arabicMonths = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
var arabicDays = ['أحد','اثن','ثلا','أرب','خمي','جمع','سبت'];
var calYear = new Date().getFullYear();
var calMonth = new Date().getMonth();

function init() {
  if (!currentUser) { window.location.href = '../index.html'; return; }
  document.getElementById('userName').textContent = currentUser.name;
  document.getElementById('userAvatar').textContent = currentUser.name.substring(0, 2);
  renderCalendar();
  getClassRef().onSnapshot(function(s) { _cloudClasses = s.docs.map(function(d) { return {id: d.id, ...d.data()}; }); renderCalendar(); });
}

function renderCalendar() {
  var d = new Date(calYear, calMonth, 1);
  document.getElementById('calTitle').textContent = arabicMonths[calMonth] + ' ' + calYear;
  var grid = document.getElementById('calGrid');
  var startDay = d.getDay();
  var daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
  var today = new Date();
  var html = arabicDays.map(function(d) { return '<div role="columnheader" style="text-align:center;font-size:12px;font-weight:600;color:var(--text2);padding:6px">' + d + '</div>'; }).join('');
  for (var i = 0; i < startDay; i++) html += '<div role="gridcell"></div>';
  for (var day = 1; day <= daysInMonth; day++) {
    var isToday = day === today.getDate() && calMonth === today.getMonth() && calYear === today.getFullYear();
    var dateStr = calYear + '-' + String(calMonth + 1).padStart(2, '0') + '-' + String(day).padStart(2, '0');
    var hasDue = false;
    for (var ci = 0; ci < _cloudClasses.length; ci++) {
      var ads = _cloudClasses[ci].assignments_data || [];
      for (var ai = 0; ai < ads.length; ai++) {
        if (ads[ai].dueISO === dateStr) { hasDue = true; break; }
      }
      if (hasDue) break;
    }
    html += '<div class="cal-day' + (isToday ? ' today' : '') + '" role="gridcell" aria-label="' + day + ' ' + arabicMonths[calMonth] + (hasDue ? '، فيه موعد تسليم' : '') + '" onclick="showNotification(\'' + day + ' ' + arabicMonths[calMonth] + '\')">' + day + (hasDue ? '<div class="dot"></div>' : '') + '</div>';
  }
  grid.innerHTML = html;
  var allTasks = [];
  for (var ci = 0; ci < _cloudClasses.length; ci++) {
    var ads = _cloudClasses[ci].assignments_data || [];
    for (var ai = 0; ai < ads.length; ai++) {
      allTasks.push({title: ads[ai].title, due: ads[ai].due, status: ads[ai].status, className: _cloudClasses[ci].name, color: (COLORS[_cloudClasses[ci].color] || COLORS[0]).bg});
    }
  }
  var pending = allTasks.filter(function(a) { return a.status === 'pending' || a.status === 'late'; });
  document.getElementById('upcomingList').innerHTML = pending.length
    ? pending.map(function(a) {
        return '<article style="display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:8px">' +
          '<div style="width:8px;height:8px;border-radius:50%;background:' + a.color + ';flex-shrink:0" aria-hidden="true"></div>' +
          '<div style="flex:1"><div style="font-size:14px;font-weight:600">' + a.title + '</div><div style="font-size:12px;color:var(--text2)">' + a.className + '</div></div>' +
          '<time style="font-size:12px;color:var(--text3)">' + a.due + '</time></article>';
      }).join('')
    : '<div class="empty-state"><i class="ti ti-calendar-check" aria-hidden="true"></i><h3>لا توجد مواعيد قادمة</h3></div>';
}

function prevMonth() { calMonth--; if (calMonth < 0) { calMonth = 11; calYear--; } renderCalendar(); }
function nextMonth() { calMonth++; if (calMonth > 11) { calMonth = 0; calYear++; } renderCalendar(); }
init();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المدرسة النظامية - تسجيل الدخول</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.44.0/tabler-icons.min.css">
<link rel="stylesheet" href="css/style.css">
<style>
.auth-card .spinner { display: inline-block; width: 16px; height: 16px; border: 2px solid rgba(255,255,255,.3); border-top-color: #fff; border-radius: 50%; animation: aspin .6s linear infinite; vertical-align: middle; margin-left: 6px; }
@keyframes aspin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div style="text-align:center;margin-bottom:20px">
      <i class="ti ti-school" style="font-size:48px;color:var(--primary)"></i>
      <h2>المدرسة النظامية</h2>
      <p style="font-size:14px;color:var(--text2);margin-top:4px">منصة التعليم التفاعلية</p>
    </div>

    <div id="loginForm">
      <h2 style="font-size:20px;margin-bottom:4px">تسجيل الدخول</h2>
      <p style="margin-bottom:20px">مرحباً بك مجدداً</p>
      <div class="form-group"><label>البريد الإلكتروني</label><input id="auth-email" type="email" placeholder="email@example.com" autocomplete="email"></div>
      <div class="form-group"><label>كلمة المرور</label><input id="auth-pass" type="password" placeholder="••••••••" autocomplete="current-password"></div>
      <button class="btn btn-primary btn-block" id="loginBtn">دخول</button>
      <div class="auth-divider"><hr><span>أو</span><hr></div>
      <button class="btn btn-secondary btn-block" id="googleBtn"><i class="ti ti-brand-google"></i> تسجيل الدخول بـ Google</button>
      <div class="auth-switch">ليس لديك حساب؟ <span id="showSignup">أنشئ حساباً</span></div>
    </div>

    <div id="signupForm" style="display:none">
      <h2 style="font-size:20px;margin-bottom:4px">إنشاء حساب</h2>
      <p style="margin-bottom:20px">انضم إلى المنصة الآن</p>
      <div class="form-group"><label>الاسم الكامل</label><input id="auth-name" placeholder="أحمد محمد" autocomplete="name"></div>
      <div class="form-group"><label>البريد الإلكتروني</label><input id="auth-email-signup" type="email" placeholder="email@example.com" autocomplete="email"></div>
      <div class="form-group"><label>كلمة المرور</label><input id="auth-pass-signup" type="password" placeholder="••••••••" autocomplete="new-password"></div>
      <div class="form-group">
        <label>الدور</label>
        <select id="auth-role"><option value="student">طالب</option><option value="teacher">معلم</option></select>
      </div>
      <button class="btn btn-primary btn-block" id="signupBtn">اشتراك</button>
      <div class="auth-divider"><hr><span>أو</span><hr></div>
      <button class="btn btn-secondary btn-block" id="googleBtn2"><i class="ti ti-brand-google"></i> التسجيل بـ Google</button>
      <div class="auth-switch">لديك حساب بالفعل؟ <span id="showLogin">تسجيل الدخول</span></div>
    </div>
  </div>
</div>

<div id="notification" class="notification hidden"></div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>

<script>
firebase.initializeApp({
  apiKey: "AIzaSyACPGcCa9V0IhjMJASYehP6NBR45IZ63Fw",
  authDomain: "edu-classroom-a2b8d.firebaseapp.com",
  projectId: "edu-classroom-a2b8d",
  storageBucket: "edu-classroom-a2b8d.firebasestorage.app",
  messagingSenderId: "1026113862086",
  appId: "1:1026113862086:web:1b5a7f0e09841987d7dac7"
});
var auth = firebase.auth();
var db = firebase.firestore();

function note(msg) {
  var n = document.getElementById('notification');
  n.innerHTML = '<i class="ti ti-info-circle"></i> ' + msg;
  n.classList.remove('hidden');
  setTimeout(function() { n.classList.add('hidden'); }, 3500);
}

function saveAndGo(uid, name, role) {
  localStorage.setItem('edu_user', JSON.stringify({uid: uid, name: name, role: role || 'student'}));
  localStorage.setItem('edu_just_logged_in', '1');
  setTimeout(function() { window.location.href = 'dashboard.html'; }, 1200);
}

function setLoading(btnId, loading) {
  var btn = document.getElementById(btnId);
  if (loading) {
    btn._orig = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> جاري...';
  } else {
    btn.disabled = false;
    if (btn._orig) btn.innerHTML = btn._orig;
  }
}

// ---- Toggle Forms ----
document.getElementById('showSignup').onclick = function() {
  document.getElementById('loginForm').style.display = 'none';
  document.getElementById('signupForm').style.display = 'block';
};
document.getElementById('showLogin').onclick = function() {
  document.getElementById('loginForm').style.display = 'block';
  document.getElementById('signupForm').style.display = 'none';
};

// ---- Login ----
document.getElementById('loginBtn').onclick = function() {
  var email = document.getElementById('auth-email').value.trim();
  var pass = document.getElementById('auth-pass').value;
  if (!email || !pass) { note('قم بملء جميع الحقول'); return; }
  setLoading('loginBtn', true);
  localStorage.setItem('edu_just_logged_in', '1');
  auth.signInWithEmailAndPassword(email, pass)
    .then(function() {
      var u = auth.currentUser;
      return db.collection('users').doc(u.uid).get().then(function(snap) {
        var data = snap.data() || {};
        var role = data.role || 'student';
        var name = data.name || u.displayName || u.email;
        saveAndGo(u.uid, name, role);
      });
    })
    .catch(function(e) { localStorage.removeItem('edu_just_logged_in'); setLoading('loginBtn', false); note(e.message); });
};

document.getElementById('auth-email').onkeydown = function(e) { if (e.key === 'Enter') document.getElementById('loginBtn').click(); };
document.getElementById('auth-pass').onkeydown = function(e) { if (e.key === 'Enter') document.getElementById('loginBtn').click(); };

// ---- Signup ----
document.getElementById('signupBtn').onclick = function() {
  var name = document.getElementById('auth-name').value.trim();
  var email = document.getElementById('auth-email-signup').value.trim();
  var pass = document.getElementById('auth-pass-signup').value;
  var role = document.getElementById('auth-role').value;
  if (!name || !email || !pass) { note('قم بملء جميع الحقول'); return; }
  if (pass.length < 6) { note('كلمة المرور 6 أحرف على الأقل'); return; }
  setLoading('signupBtn', true);
  localStorage.setItem('edu_just_logged_in', '1');
  auth.createUserWithEmailAndPassword(email, pass)
    .then(function(cred) {
      return cred.user.updateProfile({displayName: name}).then(function() {
        return db.collection('users').doc(cred.user.uid).set({
          name: name, email: email, role: role, createdAt: Date.now()
        });
      }).then(function() {
        saveAndGo(cred.user.uid, name, role);
      });
    })
    .catch(function(e) { localStorage.removeItem('edu_just_logged_in'); setLoading('signupBtn', false); note(e.message); });
};

document.getElementById('auth-name').onkeydown = function(e) { if (e.key === 'Enter') document.getElementById('signupBtn').click(); };
document.getElementById('auth-email-signup').onkeydown = function(e) { if (e.key === 'Enter') document.getElementById('signupBtn').click(); };
document.getElementById('auth-pass-signup').onkeydown = function(e) { if (e.key === 'Enter') document.getElementById('signupBtn').click(); };
document.getElementById('auth-role').onkeydown = function(e) { if (e.key === 'Enter') document.getElementById('signupBtn').click(); };

// ---- Google ----
function googleLogin(btnId) {
  setLoading(btnId, true);
  localStorage.setItem('edu_just_logged_in', '1');
  auth.signInWithPopup(new firebase.auth.GoogleAuthProvider())
    .then(function(result) {
      var user = result.user;
      return db.collection('users').doc(user.uid).get().then(function(snap) {
        if (snap.exists) {
          var data = snap.data();
          return {role: data.role || 'student', name: data.name || user.displayName};
        }
        var role = confirm('هل تريد التسجيل كمعلم؟ (OK=معلم، إلغاء=طالب)') ? 'teacher' : 'student';
        return db.collection('users').doc(user.uid).set({
          name: user.displayName, email: user.email, role: role, createdAt: Date.now()
        }).then(function() { return {role: role, name: user.displayName}; });
      }).then(function(r) {
        saveAndGo(user.uid, r.name, r.role);
      });
    })
    .catch(function(e) {
      localStorage.removeItem('edu_just_logged_in');
      setLoading(btnId, false);
      if (e.code === 'auth/popup-blocked') { note('تم حظر النافذة المنبثقة، يرجى السماح للنوافذ المنبثقة'); }
      else { note(e.message); }
    });
}
document.getElementById('googleBtn').onclick = function() { googleLogin('googleBtn'); };
document.getElementById('googleBtn2').onclick = function() { googleLogin('googleBtn2'); };

// ---- Redirect returning users ----
if (localStorage.getItem('edu_just_logged_in') && !localStorage.getItem('edu_user')) {
  localStorage.removeItem('edu_just_logged_in');
}
auth.onAuthStateChanged(function(user) {
  if (user && !localStorage.getItem('edu_just_logged_in')) {
    window.location.href = 'dashboard.html';
  }
});
</script>
</body>
</html>

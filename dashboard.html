<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المدرسة النظامية - لوحة التحكم</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.44.0/tabler-icons.min.css">
<link rel="stylesheet" href="css/style.css">
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
<script src="js/firebase-config.js"></script>
</head>
<body>
<div class="app-wrapper">

<div class="topbar">
  <a href="dashboard.html" class="logo"><i class="ti ti-school"></i><span>المدرسة النظامية</span></a>
  <div class="topbar-center">
    <a href="dashboard.html" class="nav-tab active"><i class="ti ti-home"></i><span> الرئيسية</span></a>
    <a href="pages/calendar.html" class="nav-tab"><i class="ti ti-calendar"></i><span> التقويم</span></a>
    <a href="pages/grades.html" class="nav-tab"><i class="ti ti-chart-bar"></i><span> الدرجات</span></a>
  </div>
  <div class="topbar-left">
    <button class="btn-icon" onclick="showNotification('لا توجد إشعارات جديدة')"><i class="ti ti-bell"></i></button>
    <a href="pages/profile.html" class="user-btn" id="userBtn">
      <div class="avatar" id="userAvatar">...</div>
      <span id="userName">جاري التحميل...</span>
    </a>
    <button class="btn-icon" onclick="logout()" title="تسجيل الخروج"><i class="ti ti-logout"></i></button>
  </div>
</div>

<div class="main-content">
  <div class="join-banner">
    <div>
      <h2>مرحباً بك في المدرسة النظامية 🎓</h2>
      <p id="welcomeMsg">انضم إلى صفك الدراسي وابدأ رحلة تعلمك اليوم</p>
    </div>
    <div class="join-form">
      <input class="join-input" id="joinCode" placeholder="أدخل رمز الصف..." maxlength="7">
      <button class="btn btn-primary" style="background:#fff;color:var(--primary)" onclick="joinClass()"><i class="ti ti-plus"></i> انضم الآن</button>
    </div>
  </div>
  <div class="stats-grid" id="statsGrid"></div>
  <div class="section-header">
    <span>صفوفي الدراسية</span>
    <button class="btn btn-primary btn-sm" onclick="openModal('createClass')"><i class="ti ti-plus"></i> إنشاء صف</button>
  </div>
  <div class="classes-grid" id="classesGrid"></div>
  <div style="margin-top:32px">
    <div class="section-header"><span>آخر النشاطات</span></div>
    <div class="card" id="recentActivity">
      <div class="empty-state"><i class="ti ti-activity"></i><h3>لا توجد نشاطات حديثة</h3><p>سيتم عرض آخر التحديثات هنا</p></div>
    </div>
  </div>
</div>
</div>

<div id="notification" class="notification hidden"></div>

<div id="modal-createClass" class="modal-overlay hidden">
  <div class="modal">
    <h2>إنشاء صف جديد</h2>
    <p>أنشئ صفاً دراسياً وادعُ طلابك للانضمام برمز خاص</p>
    <div class="form-group"><label>اسم الصف</label><input id="cc-name" placeholder="مثال: رياضيات — الثالث متوسط"></div>
    <div class="form-group"><label>المادة</label><input id="cc-subject" placeholder="مثال: الرياضيات"></div>
    <div class="form-group"><label>الوصف (اختياري)</label><textarea id="cc-desc" placeholder="وصف مختصر للصف..."></textarea></div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal('createClass')">إلغاء</button>
      <button class="btn btn-primary" onclick="createClass()"><i class="ti ti-plus"></i> إنشاء</button>
    </div>
  </div>
</div>

<script>try { var u = JSON.parse(localStorage.getItem('edu_user')); if (u && u.uid) currentUser = u; } catch (e) {}</script>
<script src="js/app.js"></script>
<script>
function renderDashboard() {
  if (!currentUser) { window.location.href = 'index.html'; return; }
  document.getElementById('userName').textContent = currentUser.name;
  document.getElementById('userAvatar').textContent = currentUser.name.substring(0, 2);
  document.getElementById('welcomeMsg').textContent = currentUser.role === 'teacher'
    ? 'أهلاً بك يا معلم، يمكنك إنشاء الصفوف وإدارة المهام'
    : 'انضم إلى صفك الدراسي وابدأ رحلة تعلمك اليوم';
  loadClasses();
}

function loadClasses() {
  getClassRef().onSnapshot(function(snap) {
    _cloudClasses = snap.docs.map(function(d) { return {id: d.id, ...d.data()}; });
    renderStats();
    renderClassCards();
  }, function(err) { if (err.code !== 'permission-denied') Logger.error('loadClasses: ' + err.message); });
}

function renderStats() {
  var g = document.getElementById('statsGrid');
  var total = _cloudClasses.length;
  var tasks = _cloudClasses.reduce(function(s, c) { return (c.assignments_data || []).length + s; }, 0);
  var lessons = _cloudClasses.reduce(function(s, c) { return (c.lessons_data || []).length + s; }, 0);
  var pending = _cloudClasses.reduce(function(s, c) { return (c.assignments_data || []).filter(function(a) { return a.status === 'pending'; }).length + s; }, 0);
  g.innerHTML = '<div class="stat-card"><div class="stat-card-icon" style="background:var(--primary-light);color:var(--primary)"><i class="ti ti-school"></i></div><div class="stat-card-info"><h3>' + total + '</h3><p>الصفوف المسجلة</p></div></div>' +
    '<div class="stat-card"><div class="stat-card-icon" style="background:var(--green-light);color:var(--green)"><i class="ti ti-clipboard"></i></div><div class="stat-card-info"><h3>' + tasks + '</h3><p>إجمالي المهام</p></div></div>' +
    '<div class="stat-card"><div class="stat-card-icon" style="background:var(--purple-light);color:var(--purple)"><i class="ti ti-book"></i></div><div class="stat-card-info"><h3>' + lessons + '</h3><p>الدروس المتاحة</p></div></div>' +
    '<div class="stat-card"><div class="stat-card-icon" style="background:var(--orange-light);color:var(--orange)"><i class="ti ti-clock"></i></div><div class="stat-card-info"><h3>' + pending + '</h3><p>مهام معلقة</p></div></div>';
}

function renderClassCards() {
  var g = document.getElementById('classesGrid');
  if (!_cloudClasses.length) {
    g.innerHTML = '<div style="grid-column:1/-1"><div class="empty-state"><i class="ti ti-school"></i><h3>لا توجد صفوف بعد</h3><p>أنشئ صفاً جديداً أو انضم إلى صف باستخدام رمز الصف</p><button class="btn btn-primary" onclick="openModal(\'createClass\')"><i class="ti ti-plus"></i> إنشاء صف</button></div></div>';
    return;
  }
  g.innerHTML = _cloudClasses.map(function(c) {
    var col = COLORS[c.color] || COLORS[0];
    var pending = (c.assignments_data || []).filter(function(a) { return a.status === 'pending'; }).length;
    return '<div class="class-card" onclick="openClassDetail(\'' + c.id + '\')">' +
      '<div class="class-header" style="background:' + col.grad + '">' +
      '<div class="class-icon-badge"><i class="ti ti-book"></i></div>' +
      '<div class="class-subject-badge">' + (c.subject || 'عام') + '</div>' +
      '<h3>' + c.name + '</h3><p>' + (c.teacher || '—') + '</p></div>' +
      '<div class="class-body"><div class="class-meta">' +
      '<span><i class="ti ti-users"></i> ' + (c.students || 0) + ' طالب</span>' +
      '<span><i class="ti ti-clipboard"></i> ' + (c.assignments_data || []).length + ' مهام</span>' +
      (pending ? '<span style="color:var(--orange)"><i class="ti ti-clock"></i> ' + pending + ' معلقة</span>' : '') +
      '</div><div class="class-footer"><span class="join-code">' + (c.code || '—') + '</span>' +
      '<div style="display:flex;gap:6px">' +
      '<button class="btn btn-primary btn-sm" onclick="event.stopPropagation();openClassDetail(\'' + c.id + '\')">فتح الصف</button>' +
      (currentUser && currentUser.role === 'teacher' ? '<button class="btn btn-danger btn-sm" onclick="event.stopPropagation();deleteClass(\'' + c.id + '\')" title="حذف"><i class="ti ti-trash"></i></button>' : '') +
      '</div></div><div class="progress-bar"><div class="progress-fill" style="width:' + (c.progress || 0) + '%;background:' + col.bg + '"></div></div></div></div>';
  }).join('');
}

function openClassDetail(id) { window.location.href = 'pages/class.html?id=' + id; }

function deleteClass(id) {
  if (!currentUser || currentUser.role !== 'teacher') { showNotification('فقط المعلم يمكنه حذف الصف'); return; }
  if (!confirm('هل أنت متأكد من حذف هذا الصف؟')) return;
  getAllClassesRef().doc(id).delete().then(function() { showNotification('تم حذف الصف بنجاح 🗑️'); }).catch(function(e) { showNotification(e.message); });
}

function joinClass() {
  var code = document.getElementById('joinCode').value.trim().toUpperCase();
  if (!code) { showNotification('أدخل رمز الصف أولاً ⚠️'); return; }
  getAllClassesRef().where('code', '==', code).get().then(function(snap) {
    if (snap.empty) { showNotification('لم يُعثر على صف بهذا الرمز'); return; }
    var doc = snap.docs[0];
    var data = doc.data();
    if (data.members && data.members.indexOf(currentUser.uid) >= 0) { showNotification('أنت مسجل بالفعل'); return; }
    doc.ref.update({
      members: firebase.firestore.FieldValue.arrayUnion(currentUser.uid),
      students: firebase.firestore.FieldValue.increment(1)
    }).then(function() {
      document.getElementById('joinCode').value = '';
      showNotification('تم الانضمام بنجاح! 🎉');
    });
  }).catch(function(e) { showNotification(e.message); });
}

function createClass() {
  var name = document.getElementById('cc-name').value.trim();
  var subject = document.getElementById('cc-subject').value.trim();
  if (!name || !subject) { showNotification('يرجى ملء جميع الحقول المطلوبة'); return; }
  var chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
  var code = '';
  for (var i = 0; i < 6; i++) code += chars[Math.floor(Math.random() * chars.length)];
  var col = Math.floor(Math.random() * COLORS.length);
  getAllClassesRef().add({
    name: name, subject: subject, teacher: currentUser.name, teacherId: currentUser.uid,
    color: col, code: code, students: 0, assignments: 0, progress: 0,
    assignments_data: [], lessons_data: [], stream: [], people: [],
    members: [currentUser.uid], createdAt: Date.now()
  }).then(function(ref) {
    closeModal('createClass');
    document.getElementById('cc-name').value = '';
    document.getElementById('cc-subject').value = '';
    showNotification('تم إنشاء الصف! رمز الصف: ' + code + ' ✅');
  }).catch(function(e) { showNotification(e.message); });
}

function openModal(id) { document.getElementById('modal-' + id).classList.remove('hidden'); }
function closeModal(id) { document.getElementById('modal-' + id).classList.add('hidden'); }
document.querySelectorAll('.modal-overlay').forEach(function(m) {
  m.addEventListener('click', function(e) { if (e.target === this) this.classList.add('hidden'); });
});

renderDashboard();
</script>
</body>
</html>
